<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff7a59" />
    <title>Quiz Time · Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: linear-gradient(165deg, #fff7e8, #eef9ff 50%, #fff1f4);
        color: #243447;
        padding: 1.5rem;
      }
      main {
        width: min(420px, 100%);
        background: white;
        border-radius: 28px;
        padding: 1.75rem;
        box-shadow: 0 18px 40px rgba(36, 52, 71, 0.12);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.8rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: #5d6f86;
        font-weight: 600;
        line-height: 1.45;
      }
      button {
        border: 0;
        border-radius: 18px;
        padding: 0.9rem 1.2rem;
        width: 100%;
        background: #ff7a59;
        color: white;
        font-weight: 800;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Quiz Time needs a connection to load new questions. Check your internet
        and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
